name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Allow app to query WhatsApp (Android 11+ package visibility)
        run: |
          python3 - << 'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          queries = '''    <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="whatsapp" />
                  </intent>
              </queries>

          '''
          content = content.replace("</manifest>", queries + "</manifest>")
          with open(path, "w") as f:
              f.write(content)
          print("Manifest patched")
          PYEOF

      - name: Add native AppLauncher plugin (real WhatsApp launch)
        run: |
          JAVA_DIR="android/app/src/main/java/com/tulasi/facegramapp"
          mkdir -p "$JAVA_DIR"

          cat << 'JAVAEOF' > "$JAVA_DIR/AppLauncherPlugin.java"
          package com.tulasi.facegramapp;

          import android.content.Intent;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AppLauncher")
          public class AppLauncherPlugin extends Plugin {

              @PluginMethod
              public void openPackage(PluginCall call) {
                  String packageName = call.getString("packageName");
                  if (packageName == null) {
                      call.reject("packageName is required");
                      return;
                  }
                  Intent launchIntent = getContext().getPackageManager().getLaunchIntentForPackage(packageName);
                  if (launchIntent != null) {
                      launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(launchIntent);
                      call.resolve();
                  } else {
                      call.reject("App not installed: " + packageName);
                  }
              }
          }
          JAVAEOF

          cat << 'JAVAEOF' > "$JAVA_DIR/MainActivity.java"
          package com.tulasi.facegramapp;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AppLauncherPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVAEOF

          echo "Plugin files written:"
          ls -la "$JAVA_DIR"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FacegramApp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
