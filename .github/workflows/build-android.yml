name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch AndroidManifest (package visibility + RECORD_AUDIO)
        run: |
          python3 - << 'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()

          # RECORD_AUDIO permission for speech recognition
          if 'android.permission.RECORD_AUDIO' not in content:
              content = content.replace(
                  '<manifest',
                  '<manifest',
                  1
              )
              # Insert permission after the opening <manifest ...> tag block
              import re
              content = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
                  content,
                  count=1
              )

          queries = '''    <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="whatsapp" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.action.RECOGNIZE_SPEECH" />
                  </intent>
              </queries>

          '''
          if '<queries>' not in content:
              content = content.replace("</manifest>", queries + "</manifest>")
          with open(path, "w") as f:
              f.write(content)
          print("Manifest patched (RECORD_AUDIO + queries)")
          PYEOF

      - name: Add native AppLauncher + Speech Recognition plugin
        run: |
          JAVA_DIR="android/app/src/main/java/com/tulasi/facegramapp"
          mkdir -p "$JAVA_DIR"

          cat << 'JAVAEOF' > "$JAVA_DIR/AppLauncherPlugin.java"
          package com.tulasi.facegramapp;

          import android.app.Activity;
          import android.content.Intent;
          import android.speech.RecognizerIntent;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import java.util.ArrayList;
          import java.util.Locale;

          @CapacitorPlugin(
              name = "AppLauncher",
              permissions = {
                  @Permission(strings = { android.Manifest.permission.RECORD_AUDIO }, alias = "speechRecognition")
              }
          )
          public class AppLauncherPlugin extends Plugin {

              @PluginMethod
              public void openPackage(PluginCall call) {
                  String packageName = call.getString("packageName");
                  if (packageName == null) {
                      call.reject("packageName is required");
                      return;
                  }
                  Intent launchIntent = getContext().getPackageManager().getLaunchIntentForPackage(packageName);
                  if (launchIntent != null) {
                      launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(launchIntent);
                      call.resolve();
                  } else {
                      call.reject("App not installed: " + packageName);
                  }
              }

              /**
               * Starts the system Android speech recognizer (RecognizerIntent).
               * Shows the familiar Android "Speak now" UI — ideal for seniors.
               * Returns { text: "recognized words" } or rejects on cancel/error.
               */
              @PluginMethod
              public void startSpeechRecognition(PluginCall call) {
                  if (!android.speech.SpeechRecognizer.isRecognitionAvailable(getContext())) {
                      call.reject("Speech recognition is not available on this device");
                      return;
                  }

                  String prompt = call.getString("prompt", "Say a command, for example Open WhatsApp");
                  Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault());
                  intent.putExtra(RecognizerIntent.EXTRA_PROMPT, prompt);
                  intent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3);

                  try {
                      startActivityForResult(call, intent, "speechResult");
                  } catch (Exception e) {
                      call.reject("Could not start speech recognition: " + e.getMessage());
                  }
              }

              @ActivityCallback
              private void speechResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;

                  if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null) {
                      call.reject("Speech recognition cancelled or failed");
                      return;
                  }

                  ArrayList<String> matches = result.getData().getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                  if (matches == null || matches.isEmpty()) {
                      call.reject("No speech detected");
                      return;
                  }

                  JSObject ret = new JSObject();
                  ret.put("text", matches.get(0));
                  // Also expose all alternatives for future fuzzy matching
                  ret.put("matches", matches);
                  call.resolve(ret);
              }
          }
          JAVAEOF

          cat << 'JAVAEOF' > "$JAVA_DIR/MainActivity.java"
          package com.tulasi.facegramapp;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AppLauncherPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVAEOF

          echo "Plugin files written:"
          ls -la "$JAVA_DIR"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FacegramApp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
